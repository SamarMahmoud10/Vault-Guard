services:
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from :80 --to api:8000
    depends_on:
      - api
    networks:
      - frontend-net 

  api:
    build: ./api
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-net 
      - backend-net   

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net 

volumes:
  postgres_data:

networks:
  frontend-net: 
  backend-net:  
    internal: true 